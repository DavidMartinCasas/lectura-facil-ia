server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # La API pone sus propias cabeceras de seguridad; aquí no se añaden para no duplicarlas.
    location /api/ {
        # PDFs de hasta LIMITS__MAXFILESIZEBYTES (5 MB por defecto) más el formulario; la API aplica el límite exacto.
        # Si subes ese límite, sube estos dos valores. El cuerpo se queda en memoria: nginx no lo escribe en disco.
        client_max_body_size 6m;
        client_body_buffer_size 6m;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        # Se sustituye (no se añade) para que el cliente no pueda falsear su IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Progreso por Server-Sent Events: sin búfer, para que cada estado llegue al navegador en cuanto se envía.
    # Si pasa este tiempo sin eventos, nginx corta y el navegador vuelve a conectarse solo. Basta con un poco más que
    # LIMITS__DOCUMENTEVENTSMAXSECONDS por defecto (600 s): así no quedan sockets abiertos más de lo necesario.
    location ~ ^/api/documents/[^/]+/events$ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 660s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://api:8080;
    }

    # Las métricas de la API (US-17) son solo para la red interna: nunca se publican por aquí.
    location ^~ /metrics {
        return 404;
    }

    # Aplicación Angular. 'unsafe-inline' solo en estilos: Angular y Angular Material inyectan <style>.
    location / {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        try_files $uri $uri/ /index.html;
    }
}
