<section class="page" aria-labelledby="page-title">
  <h1 id="page-title">{{ texts.pageTitle }}</h1>
  <p class="intro">{{ texts.intro }}</p>

  <mat-card appearance="outlined" class="notice" role="note">
    <mat-card-content>{{ draftNotice }}</mat-card-content>
  </mat-card>

  @if (showForm()) {
    <app-upload-form [busy]="store.phase() === 'submitting'" (submitted)="submit($event)" />
  }

  @if (store.steps(); as steps) {
    <app-progress-steps [steps]="steps" />
  }

  @if (store.error(); as message) {
    <div class="error" role="alert">
      <p>{{ message }}</p>
      <div class="actions">
        <button mat-flat-button type="button" (click)="store.retry()">
          {{ progressTexts.retry }}
        </button>
        @if (!showForm()) {
          <button mat-stroked-button type="button" (click)="store.reset()">
            {{ progressTexts.startOver }}
          </button>
        }
      </div>
    </div>
  }
</section>
