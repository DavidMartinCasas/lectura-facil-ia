<button
  mat-flat-button
  type="button"
  class="export-button"
  [matMenuTriggerFor]="formatsMenu"
  [disabled]="!canExport() || exporting()"
  [attr.aria-describedby]="canExport() ? 'export-hint' : 'export-blocked'"
>
  <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false">
    <path d="M10 3v9.5M6 8.75l4 4 4-4M4 16.25h12" />
  </svg>
  {{ exporting() ? texts.exporting : texts.exportButton }}
</button>
<span class="visually-hidden" id="export-hint">{{ texts.exportHint }}</span>
@if (!canExport()) {
  <span class="visually-hidden" id="export-blocked">{{ blockedMessage() }}</span>
}

<mat-menu #formatsMenu="matMenu" xPosition="before" [ariaLabel]="texts.exportFormatLabel">
  @for (option of formats; track option) {
    <button mat-menu-item type="button" (click)="submit(option)">{{ labels[option] }}</button>
  }
  <p class="export-menu-hint" aria-hidden="true">{{ texts.exportHint }}</p>
</mat-menu>
