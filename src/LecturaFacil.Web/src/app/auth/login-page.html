<section class="page login" aria-labelledby="page-title">
  <h1 id="page-title">{{ texts.pageTitle }}</h1>
  <p class="intro">{{ texts.intro }}</p>

  <form class="login-form" (submit)="submit($event)" novalidate>
    <mat-form-field appearance="outline">
      <mat-label>{{ texts.emailLabel }}</mat-label>
      <input
        matInput
        name="email"
        type="email"
        autocomplete="username"
        maxlength="256"
        required
        [value]="email()"
        (input)="onEmailInput($event)"
        [attr.aria-invalid]="error() ? true : null"
        [attr.aria-describedby]="error() ? 'login-error' : null"
      />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>{{ texts.passwordLabel }}</mat-label>
      <input
        matInput
        name="password"
        type="password"
        autocomplete="current-password"
        maxlength="128"
        required
        [value]="password()"
        (input)="onPasswordInput($event)"
        [attr.aria-invalid]="error() ? true : null"
        [attr.aria-describedby]="error() ? 'login-error' : null"
      />
    </mat-form-field>

    @if (error(); as message) {
      <div id="login-error" class="error" role="alert">
        <p>{{ message }}</p>
      </div>
    }

    <div class="actions">
      <button mat-flat-button type="submit" [disabled]="busy()">
        {{ busy() ? texts.submitting : texts.submit }}
      </button>
    </div>
  </form>
</section>
