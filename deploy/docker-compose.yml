# SPDX-License-Identifier: Apache-2.0
# Entorno completo: PostgreSQL, migraciones, API y frontend.
#   cp deploy/.env.example deploy/.env   (y cambia los valores)
#   docker compose -f deploy/docker-compose.yml up --build
# Solo se publica el frontend (en 127.0.0.1); nginx reenvía /api y /health a la API.
# En producción, añade deploy/docker-compose.prod.yml (sin puertos publicados): ver docs/despliegue.md.
#
# Base de datos con mínimo privilegio (deploy/postgres/initdb/10-roles.sh, solo al crear el volumen):
#   POSTGRES_USER        superusuario; solo inicializa la base y hace los backups.
#   POSTGRES_OWNER_USER  propietario del esquema; lo usa el servicio "migrate", que aplica las migraciones y termina.
#   POSTGRES_APP_USER    el de la API; solo lee y escribe filas.

name: lectura-facil

# Lo común a la API y a su paso de migraciones: la misma imagen y el mismo endurecimiento.
x-api: &api
  image: lectura-facil-api:${IMAGE_TAG:-local}
  build:
    context: ..
    dockerfile: src/LecturaFacil.Api/Dockerfile
  # Opciones de la API (LLM__*, LIMITS__*, UI__*). Se validan al arrancar: si falta alguna obligatoria, no arranca.
  env_file:
    - .env
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

# deploy/.env llega entero a la API (env_file): se vacían las contraseñas de los otros roles para que no las vea.
x-no-postgres-secrets: &no-postgres-secrets
  POSTGRES_PASSWORD: ""
  POSTGRES_OWNER_PASSWORD: ""
  POSTGRES_APP_PASSWORD: ""

services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lecturafacil}
      POSTGRES_USER: ${POSTGRES_USER:-lecturafacil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en deploy/.env}
      POSTGRES_OWNER_USER: ${POSTGRES_OWNER_USER:-lecturafacil_owner}
      POSTGRES_OWNER_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?Define POSTGRES_OWNER_PASSWORD en deploy/.env}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-lecturafacil_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Define POSTGRES_APP_PASSWORD en deploy/.env}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # Aplica las migraciones pendientes con el rol propietario y termina; la API espera a que acabe bien.
  migrate:
    <<: *api
    command: ["--migrate"]
    environment:
      <<: *no-postgres-secrets
      ASPNETCORE_ENVIRONMENT: Production
      # Las credenciales van aparte: la API las escapa al construir la cadena (una contraseña con ";" no la rompe).
      Database__ConnectionString: "Host=postgres;Port=5432"
      Database__Name: ${POSTGRES_DB:-lecturafacil}
      Database__Username: ${POSTGRES_OWNER_USER:-lecturafacil_owner}
      Database__Password: ${POSTGRES_OWNER_PASSWORD:?Define POSTGRES_OWNER_PASSWORD en deploy/.env}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    restart: "no"

  api:
    <<: *api
    environment:
      <<: *no-postgres-secrets
      ASPNETCORE_ENVIRONMENT: Production
      Database__ConnectionString: "Host=postgres;Port=5432"
      Database__Name: ${POSTGRES_DB:-lecturafacil}
      Database__Username: ${POSTGRES_APP_USER:-lecturafacil_app}
      Database__Password: ${POSTGRES_APP_PASSWORD:?Define POSTGRES_APP_PASSWORD en deploy/.env}
      # Las migraciones las aplica el servicio "migrate": el rol de la API no puede cambiar el esquema.
      Database__ApplyMigrationsOnStartup: "false"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - backend
      - frontend
    restart: unless-stopped

  web:
    image: lectura-facil-web:${IMAGE_TAG:-local}
    build:
      context: ../src/LecturaFacil.Web
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      - api
    networks:
      - frontend
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

networks:
  backend:
  frontend:

volumes:
  postgres-data:
