# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restaurar
        run: dotnet restore

      - name: Compilar sin avisos
        run: dotnet build --no-restore -warnaserror

      - name: Formato
        run: dotnet format --no-restore --verify-no-changes

      # Incluye Testcontainers (PostgreSQL) y el umbral de cobertura del 80 % en Domain y Application.
      - name: Tests
        run: dotnet test --no-build

      - name: Paquetes vulnerables
        run: |
          dotnet list package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Hay paquetes NuGet con vulnerabilidades conocidas."
            exit 1
          fi

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src/LecturaFacil.Web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/LecturaFacil.Web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test -- --watch=false
      - run: npm run build
      - name: Auditoría de dependencias
        run: npm audit --omit=dev --audit-level=high

  secrets:
    name: Secretos (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: gitleaks
        run: >
          docker run --rm -v "${{ github.workspace }}:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          detect --source /repo --no-banner --redact

  containers:
    name: Contenedores
    runs-on: ubuntu-24.04
    env:
      BASE: -f deploy/docker-compose.yml
      PROD: -f deploy/docker-compose.yml -f deploy/docker-compose.prod.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint de Dockerfiles (hadolint)
        run: |
          for dockerfile in src/LecturaFacil.Api/Dockerfile src/LecturaFacil.Web/Dockerfile; do
            echo "$dockerfile"
            docker run --rm -i hadolint/hadolint:v2.14.0@sha256:27086352fd5e1907ea2b934eb1023f217c5ae087992eb59fde121dce9c9ff21e < "$dockerfile"
          done

      - name: Lint de scripts (shellcheck)
        run: >
          docker run --rm -v "${{ github.workspace }}/deploy:/mnt:ro"
          koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d
          /mnt/scripts/backup-postgres.sh /mnt/postgres/initdb/10-roles.sh

      - name: Validar docker-compose
        run: |
          cp deploy/.env.example deploy/.env
          # Contraseñas con separadores y comillas: los roles se crean y la API arranca igual (credenciales escapadas).
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci;con=separadores/' deploy/.env
          sed -i "s/^POSTGRES_OWNER_PASSWORD=.*/POSTGRES_OWNER_PASSWORD=ci-owner;o'reilly/" deploy/.env
          sed -i 's/^POSTGRES_APP_PASSWORD=.*/POSTGRES_APP_PASSWORD=ci-app;con=separadores/' deploy/.env
          docker compose $BASE config --quiet
          docker compose $PROD config --quiet
          # Producción no publica ningún puerto en el host.
          published=$(docker compose $PROD config --format json | jq '[.services[] | select((.ports // []) | length > 0)] | length')
          test "$published" = 0

      - name: Construir imágenes
        run: docker compose $BASE build

      # Criterio "Todo arranca con Docker Compose": /health a través de nginx y la página de inicio.
      - name: Prueba de humo
        run: |
          docker compose $BASE up -d --wait
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/health > health.json && break
            sleep 2
          done
          test "$(cat health.json)" = '{"status":"Healthy"}'
          curl -fsS http://localhost:8080/ | grep -q "<title>Lectura Fácil IA</title>"
          curl -fsSI http://localhost:8080/ | grep -qi "^content-security-policy: default-src 'self'"
          curl -fsSI http://localhost:8080/ | grep -qi "^x-content-type-options: nosniff"

      # Mínimo privilegio (US-10): las migraciones terminaron bien y la cuenta de la API solo puede tocar filas.
      - name: Roles de PostgreSQL
        run: |
          test "$(docker compose $BASE ps -a --format '{{.ExitCode}}' migrate)" = 0
          as_app() {
            docker compose $BASE exec -T postgres sh -c \
              'PGPASSWORD="$POSTGRES_APP_PASSWORD" psql -h 127.0.0.1 -U "$POSTGRES_APP_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -tAc "$1"' \
              sh "$1"
          }
          test "$(as_app "select rolsuper or rolcreatedb or rolcreaterole from pg_roles where rolname = current_user")" = f
          test "$(as_app "select count(*) > 0 from \"__EFMigrationsHistory\"")" = t
          if as_app "create table intruso (id int)"; then
            echo "::error::La cuenta de la API puede crear tablas."
            exit 1
          fi
          if as_app "drop table \"__EFMigrationsHistory\""; then
            echo "::error::La cuenta de la API puede borrar tablas."
            exit 1
          fi

      - name: Logs si falla
        if: failure()
        run: docker compose $BASE logs --no-color

      - name: Parar
        if: always()
        run: docker compose $BASE down -v
