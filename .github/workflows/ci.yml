# SPDX-License-Identifier: Apache-2.0
# Controles de calidad y seguridad (US-19). Si alguno falla, la PR no se puede fusionar (protección de main en
# docs/despliegue.md). En main no se lanza solo: lo llama deploy.yml antes de publicar y desplegar.
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restaurar
        run: dotnet restore

      - name: Compilar sin avisos
        run: dotnet build --no-restore -warnaserror

      - name: Formato
        run: dotnet format --no-restore --verify-no-changes

      # Incluye Testcontainers (PostgreSQL) y el umbral de cobertura del 80 % en Domain y Application.
      - name: Tests
        run: dotnet test --no-build

      - name: Resumen de cobertura
        if: ${{ !cancelled() }}
        run: .github/scripts/coverage-summary.sh TestResults

      - name: Informes de cobertura
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cobertura
          path: TestResults/coverage.cobertura*.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Paquetes vulnerables
        run: |
          dotnet list package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Hay paquetes NuGet con vulnerabilidades conocidas."
            exit 1
          fi

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src/LecturaFacil.Web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/LecturaFacil.Web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test -- --watch=false
      - run: npm run build
      - name: Auditoría de dependencias
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src/LecturaFacil.Web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/LecturaFacil.Web/package-lock.json

      - run: npm ci
      # Los perfiles de escritorio y móvil usan Chromium, en la versión que fija package-lock.json.
      - name: Navegador de Playwright
        run: npx playwright install --with-deps chromium
      # Simulan la API en el navegador: no necesitan backend ni LLM.
      - run: npm run e2e

  evals:
    name: Evaluación (--dry-run)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      # Proveedor falso con los textos de ejemplo: ni modelos ni claves.
      - name: Evaluación simulada
        run: dotnet run --project evals/LecturaFacil.Evals -- --dry-run

      - name: Informe de la evaluación
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evaluacion-dry-run
          path: evals/resultados/*-dry-run/
          if-no-files-found: warn
          retention-days: 14

  workflows:
    name: Workflows (actionlint)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # La imagen incluye shellcheck, que revisa también los run: de los workflows.
      - name: actionlint
        run: >
          docker run --rm -v "${{ github.workspace }}:/repo:ro" --workdir /repo
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -color

  secrets:
    name: Secretos (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: gitleaks
        run: >
          docker run --rm -v "${{ github.workspace }}:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          detect --source /repo --no-banner --redact

  containers:
    name: Contenedores
    runs-on: ubuntu-24.04
    env:
      # Compose base para build, logs y down; los scripts de .github/scripts nombran sus ficheros.
      COMPOSE_FILE: deploy/docker-compose.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint de Dockerfiles (hadolint)
        run: |
          for dockerfile in src/LecturaFacil.Api/Dockerfile src/LecturaFacil.Web/Dockerfile; do
            echo "$dockerfile"
            docker run --rm -i hadolint/hadolint:v2.14.0@sha256:27086352fd5e1907ea2b934eb1023f217c5ae087992eb59fde121dce9c9ff21e < "$dockerfile"
          done

      - name: Lint de scripts (shellcheck)
        run: >
          docker run --rm -v "${{ github.workspace }}:/mnt:ro"
          koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d
          /mnt/deploy/scripts/backup-postgres.sh /mnt/deploy/scripts/deploy.sh /mnt/deploy/postgres/initdb/10-roles.sh
          /mnt/tests/deploy/test-deploy.sh /mnt/.github/scripts/coverage-summary.sh
          /mnt/.github/scripts/deploy-over-ssh.sh /mnt/.github/scripts/check-version.sh
          /mnt/.github/scripts/validate-compose.sh /mnt/.github/scripts/smoke-test.sh /mnt/.github/scripts/check-db-roles.sh

      - name: Validar docker-compose
        run: .github/scripts/validate-compose.sh

      - name: Construir imágenes
        run: docker compose build

      # Criterio "Todo arranca con Docker Compose": /health a través de nginx y la página de inicio.
      - name: Prueba de humo
        run: .github/scripts/smoke-test.sh

      # Mínimo privilegio (US-10): las migraciones terminaron bien y la cuenta de la API solo puede tocar filas.
      - name: Roles de PostgreSQL
        run: .github/scripts/check-db-roles.sh

      # US-19: deploy.sh contra un registro local con la capa de producción (despliegue, copia y vuelta atrás).
      - name: Script de despliegue
        run: tests/deploy/test-deploy.sh

      - name: Logs si falla
        if: failure()
        run: docker compose logs --no-color

      - name: Parar
        if: always()
        run: docker compose down -v
