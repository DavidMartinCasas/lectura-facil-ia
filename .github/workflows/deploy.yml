# SPDX-License-Identifier: Apache-2.0
# Despliegue continuo (US-19): cada push a main (una PR fusionada) pasa la CI completa, publica las imágenes en GitHub
# Container Registry con la etiqueta del commit y, si el despliegue está configurado, las despliega en el servidor.
# Solo se lanza con push a main: nunca en pull requests ni con código de forks.
# Qué hay que configurar (secretos, variables, ACL y servidor): docs/despliegue.md, "Despliegue automático".
name: Deploy

on:
  push:
    branches: [main]

# Sin permisos por defecto: cada job pide solo los suyos.
permissions: {}

# Un despliegue cada vez, sin cancelar el que está en marcha. GitHub deja solo una ejecución en espera por grupo: si
# llegan varias fusiones seguidas, se cancelan las intermedias y se despliega la más reciente.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Publicar imágenes
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    # Digests de lo publicado: el servidor descarga por digest, así que una etiqueta reescrita en el registro no cuenta.
    outputs:
      api_digest: ${{ steps.publish.outputs.api_digest }}
      web_digest: ${{ steps.publish.outputs.web_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ghcr.io/<propietario en minúsculas>/lectura-facil-{api,web}:<sha>. Inicia sesión después de construir.
      - name: Construir y publicar
        id: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/publish-images.sh

  deploy:
    name: Desplegar en el servidor
    needs: publish
    # Solo si quien mantiene el repositorio lo ha configurado (los forks no tienen servidor ni secretos).
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    # Secretos y variables del despliegue, limitados a la rama main en la configuración del environment.
    environment: production
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Nodo efímero con la etiqueta tag:ci: sale del tailnet al terminar. La ACL solo le deja llegar al SSH del servidor.
      - name: Entrar en la red privada (Tailscale)
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ vars.DEPLOY_HOST }}

      # En el servidor: copia de la base, pull por digest, up -d y /health con esta versión; si falla, vuelve a la anterior.
      - name: Desplegar por SSH
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          API_DIGEST: ${{ needs.publish.outputs.api_digest }}
          WEB_DIGEST: ${{ needs.publish.outputs.web_digest }}
        run: .github/scripts/deploy-over-ssh.sh "$GITHUB_SHA" "$API_DIGEST" "$WEB_DIGEST"

      # Opcional e informativa: la misma comprobación desde internet, a través del proxy y la CDN. Si falla, el job sale
      # en rojo pero no vuelve atrás (la vuelta atrás la decide deploy.sh con su comprobación dentro del servidor).
      - name: Comprobar la URL pública
        if: ${{ vars.PUBLIC_URL != '' }}
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: .github/scripts/check-version.sh "${PUBLIC_URL%/}/health" "$GITHUB_SHA"
