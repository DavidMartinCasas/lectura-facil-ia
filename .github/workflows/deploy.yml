# SPDX-License-Identifier: Apache-2.0
# Despliegue continuo (US-19): cada push a main (una PR fusionada) pasa la CI completa, publica las imágenes en GitHub
# Container Registry con la etiqueta del commit y, si el despliegue está configurado, las despliega en el servidor.
# Solo se lanza con push a main: nunca en pull requests ni con código de forks.
# Qué hay que configurar (secretos, variables, ACL y servidor): docs/despliegue.md, "Despliegue automático".
name: Deploy

on:
  push:
    branches: [main]

# Sin permisos por defecto: cada job pide solo los suyos.
permissions: {}

# Un despliegue cada vez y en orden: el siguiente espera a que termine el anterior, sin cancelarlo.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Publicar ${{ matrix.image }}
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: lectura-facil-api
            context: .
            dockerfile: src/LecturaFacil.Api/Dockerfile
          - image: lectura-facil-web
            context: src/LecturaFacil.Web
            dockerfile: src/LecturaFacil.Web/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Iniciar sesión en GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      # ghcr.io/<propietario en minúsculas>/<imagen>:<sha>. La etiqueta source enlaza el paquete con el repositorio.
      - name: Construir y publicar
        env:
          IMAGE: ${{ matrix.image }}
          CONTEXT: ${{ matrix.context }}
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: |
          ref="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$IMAGE:$GITHUB_SHA"
          docker build --pull --file "$DOCKERFILE" --tag "$ref" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.licenses=Apache-2.0" \
            "$CONTEXT"
          docker push "$ref"

      - name: Cerrar sesión en GHCR
        if: ${{ always() }}
        run: docker logout ghcr.io

  deploy:
    name: Desplegar en el servidor
    needs: publish
    # Solo si quien mantiene el repositorio lo ha configurado (los forks no tienen servidor ni secretos).
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    # Secretos y variables del despliegue, limitados a la rama main en la configuración del environment.
    environment: production
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Nodo efímero con la etiqueta tag:ci: sale del tailnet al terminar. La ACL solo le deja llegar al SSH del servidor.
      - name: Entrar en la red privada (Tailscale)
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ vars.DEPLOY_HOST }}

      # En el servidor: copia de la base, pull, up -d y /health con esta versión; si falla, vuelve a la anterior.
      - name: Desplegar por SSH
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: .github/scripts/deploy-over-ssh.sh "$GITHUB_SHA"

      # Opcional: la misma comprobación desde internet, a través del proxy.
      - name: Comprobar la URL pública
        if: ${{ vars.PUBLIC_URL != '' }}
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: .github/scripts/check-version.sh "${PUBLIC_URL%/}/health" "$GITHUB_SHA"
